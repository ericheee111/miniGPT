[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "minitrain-gpt"
dynamic = ["version"]
description = "CPU-first GPT training and profiling lab"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
    "torch>=2.2",
    "tqdm>=4.66",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "uvicorn>=0.35",
]
report = [
    "matplotlib>=3.10",
]
story = [
    "tokenizers>=0.22,<0.23",
    "huggingface-hub>=0.35,<1.0",
    "pyarrow>=21,<22",
]
dev = [
    "build>=1.2",
    "basedpyright>=1.39.9",
    "fastapi>=0.116",
    "httpx>=0.28",
    "matplotlib>=3.10",
    "pytest>=8.0",
    "ruff>=0.15.20",
    "uvicorn>=0.35",
]

[project.scripts]
minigpt = "minigpt.cli:main"

[tool.setuptools.dynamic]
version = {attr = "minigpt._version.__version__"}

[tool.setuptools]
packages = ["minigpt"]
package-dir = {minigpt = "src/minigpt"}
py-modules = ["prepare_data", "prepare_stories", "train", "generate", "simulate_serving", "serve"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

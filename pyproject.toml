[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "minitrain-gpt"
version = "0.1.0"
description = "CPU-first GPT training and profiling lab"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
    "torch>=2.2",
    "tqdm>=4.66",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
report = [
    "matplotlib>=3.10",
]
dev = [
    "basedpyright>=1.39.9",
    "matplotlib>=3.10",
    "pytest>=8.0",
    "ruff>=0.15.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

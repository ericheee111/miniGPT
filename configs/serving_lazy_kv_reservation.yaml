schema_version: 1
scenario_name: lazy-kv-reservation
executor: paged_attention
kv_cache_backend: paged
kv_cache: {block_tokens: 2, num_blocks: 4}
prefix_cache: {enabled: false}
model_seed: 1818
tick_seconds: 0.01
executor_clock_step_seconds: 0.001
max_ticks: 256
output_dir: reports/lazy-kv-reservation/simulator
vocab_size: 31
model: {block_size: 8, n_layer: 2, n_head: 2, n_embd: 8, dropout: 0.0, bias: false}
prefill: {max_batch_size: 2, max_batch_tokens: 8, max_padding_ratio: 1.0}
scheduler:
  max_active_requests: 2
  max_cached_tokens: 8
  max_scheduled_tokens: 8
  prefill_chunk_tokens: 2
  kv_preemption: true
  lazy_kv_reservation: true
  kv_overcommit_ratio: 2.0
requests:
  - {request_id: lazy-a, arrival_time: 0.0, prompt_tokens: [1, 2, 3, 4], prompt_length: null, max_new_tokens: 5, temperature: 1.0, top_k: null, seed: 1801, cancellation_time: null}
  - {request_id: lazy-b, arrival_time: 0.0, prompt_tokens: [1, 2, 3, 4], prompt_length: null, max_new_tokens: 5, temperature: 1.0, top_k: null, seed: 1802, cancellation_time: null}

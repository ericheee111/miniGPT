# Recommended local CPU methodology. This file contains no measured machine result.
schema_version: 2
experiment_name: benchmark_v2_reference
benchmark_seed: 1337
vocab_size: 65
output_root: reports/benchmark-v2
worker_timeout_seconds: 300
warmup_steps: 10
measurement_steps: 20
replicates: 7
torch_num_interop_threads: 1
cpu_affinity: null
max_cv_percent: 10.0
minimum_replicates: 5
regression_threshold_percent: 5.0
relevant_environment_variables:
  - OMP_NUM_THREADS
  - MKL_NUM_THREADS
models:
  teaching:
    n_layer: 4
    n_head: 4
    n_embd: 128
cases:
  # Shared baseline, intentionally declared once rather than expanded as a matrix.
  - name: teaching_t12_s128_b16
    model_name: teaching
    torch_num_threads: 12
    block_size: 128
    batch_size: 16
  - name: teaching_t1_s128_b16
    model_name: teaching
    torch_num_threads: 1
    block_size: 128
    batch_size: 16
  - name: teaching_t4_s128_b16
    model_name: teaching
    torch_num_threads: 4
    block_size: 128
    batch_size: 16
  - name: teaching_t8_s128_b16
    model_name: teaching
    torch_num_threads: 8
    block_size: 128
    batch_size: 16
  - name: teaching_t20_s128_b16
    model_name: teaching
    torch_num_threads: 20
    block_size: 128
    batch_size: 16
  - name: teaching_t12_s64_b16
    model_name: teaching
    torch_num_threads: 12
    block_size: 64
    batch_size: 16
  - name: teaching_t12_s256_b16
    model_name: teaching
    torch_num_threads: 12
    block_size: 256
    batch_size: 16
  - name: teaching_t12_s128_b4
    model_name: teaching
    torch_num_threads: 12
    block_size: 128
    batch_size: 4
  - name: teaching_t12_s128_b8
    model_name: teaching
    torch_num_threads: 12
    block_size: 128
    batch_size: 8
  - name: teaching_t12_s128_b32
    model_name: teaching
    torch_num_threads: 12
    block_size: 128

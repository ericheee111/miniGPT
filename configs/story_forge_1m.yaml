runtime:
  seed: 20260901
  num_threads: 20
  device: cpu
data:
  directory: data/story_forge
  block_size: 512
  batch_size: 8
model:
  vocab_size: null
  n_layer: 3
  n_head: 4
  n_embd: 96
  dropout: 0.1
  bias: false
optimizer:
  type: adamw
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
training:
  max_steps: 3000
  warmup_steps: 100
  lr_decay_steps: 3000
  eval_interval: 50
  eval_batches: 20
  log_interval: 10
  checkpoint_interval: 500
  sample_interval: 500
  sample_tokens: 96
  sample_prompt: "<bos><world_space><tone_adventurous><theme_discovery><story>Once upon a time, "
  output_dir: outputs/story_forge_1m
  checkpoint_dir: checkpoints/story_forge_1m
  tensorboard_dir: outputs/story_forge_1m/tensorboard
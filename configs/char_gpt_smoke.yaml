runtime:
  seed: 1337
  num_threads: 4
  device: cpu
data:
  directory: data/processed
  block_size: 32
  batch_size: 4
model:
  vocab_size: null
  n_layer: 2
  n_head: 2
  n_embd: 64
  dropout: 0.0
  bias: false
optimizer:
  type: adamw
  learning_rate: 0.001
  min_learning_rate: 0.0001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
training:
  max_steps: 2
  warmup_steps: 0
  lr_decay_steps: 2
  eval_interval: 1
  eval_batches: 2
  log_interval: 1
  checkpoint_interval: 1
  sample_interval: 1
  sample_tokens: 16
  sample_prompt: "ROMEO:"
  output_dir: outputs/smoke
  checkpoint_dir: checkpoints/smoke
  tensorboard_dir: outputs/smoke/tensorboard

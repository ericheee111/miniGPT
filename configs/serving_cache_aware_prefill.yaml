schema_version: 1
executor: paged_attention
kv_cache_backend: paged
kv_cache: {block_tokens: 2, num_blocks: 32}
prefix_cache: {enabled: true}
apc_prefill_strategy: batched
scenario_name: cache-aware-batched-paged-prefill
model_seed: 1500
tick_seconds: 1.0
executor_clock_step_seconds: 0.001
max_ticks: 128
output_dir: reports/cache-aware-batched-prefill/simulator
vocab_size: 32
model: {block_size: 16, n_layer: 2, n_head: 2, n_embd: 16, dropout: 0.0, bias: false}
prefill: {max_batch_size: 8, max_batch_tokens: 64, max_padding_ratio: 1.0}
scheduler: {max_active_requests: 5, max_cached_tokens: 80}
